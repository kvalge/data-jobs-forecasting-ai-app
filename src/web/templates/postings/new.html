{% extends "base.html" %}

{% block title %}Add job posting — Job Market Analyzer{% endblock %}

{% block content %}
<section class="panel">
  <h2>Add job posting</h2>
  <p class="hint">
    Paste the posting text below, or upload a UTF-8 <code>.txt</code> file.
    If a file is uploaded, it is used instead of the pasted text.
  </p>

  <form method="post" action="{{ url_for('postings.create_posting') }}" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="posting_text">Posting text</label>
      <textarea id="posting_text" name="posting_text" placeholder="Paste the full job posting here…"></textarea>
    </div>

    <hr class="divider">

    <div class="form-group">
      <label for="posting_file">Or upload a .txt file</label>
      <input id="posting_file" name="posting_file" type="file" accept=".txt,text/plain">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Extract and save</button>
    </div>
  </form>
</section>
{% endblock %}
